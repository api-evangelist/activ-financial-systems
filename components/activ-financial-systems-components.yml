note: ACTIV publishes its market-data example applications as embeddable Web Components
  on npm (the one-api-examples repo notes the Examples section is built using Web
  Components so custom HTML elements can be imported into existing projects). Hosted
  versions run at https://weboneapi.activfinancial.com/examples. Two generations
  exist - oneapi-* components against the OnePlatform Web API, and the earlier cg-api
  viewer components against the ContentGateway API.
