apis:
- name: ACTIV OnePlatform Web API (One API)
  description: WebSocket/WebAssembly JavaScript API for the ACTIV OnePlatform (Options Atlas),
    delivering real-time streaming subscriptions, snapshots, queries, and time-series
    (tick, intraday bar, history bar) market data through a session contract (connect
    to a OneApi Gateway, then Session.snapshot/subscribe/query/timeSeries). Not REST -
    the machine-readable contract is the TypeDoc JSON shipped in the
    "@activfinancial/one-api" npm package.
  humanURL: https://weboneapi.activfinancial.com/
