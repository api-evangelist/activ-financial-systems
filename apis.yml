name: ACTIV Financial Systems
description: 'ACTIV Financial Systems is a provider of real-time and historical financial market data,
  best known for the ACTIV Feed consolidated multi-asset market data feed delivering global equities, options,
  futures, foreign exchange, and fixed income content with associated analytics and low-latency delivery to
  trading firms, banks, and financial applications. ACTIV Financial was acquired by Options Technology
  (Options-IT) in 2021 and its market data capabilities are delivered as part of the Options Atlas platform;
  www.activfinancial.com now redirects to www.options-it.com. A live public developer surface remains: the
  OnePlatform Web API (One API), a WebSocket/WebAssembly JavaScript API with a developer portal at
  weboneapi.activfinancial.com and 25 first-party packages on npm under the @activfinancial scope, with
  gateway hosts and credentials provisioned per customer rather than self-serve.'
