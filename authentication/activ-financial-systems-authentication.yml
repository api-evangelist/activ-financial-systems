  transport: websocket
  oauth2_flows: []
  api_key_in: []
  self_serve_signup: false
schemes:
- name: OneApiGatewayCredentials
  type: credentials
  description: user + password supplied in ConnectParameters when calling connect()
    against a customer-provisioned OneApi Gateway host; session-scoped, one active
    session at a time.
  parameters:
  - name: host
    description: The host to connect to (customer-provisioned OneApi Gateway).
    required: false
  - name: user
    description: The username to connect with.
    required: false
  - name: password
    description: The password for the user.
    required: false
