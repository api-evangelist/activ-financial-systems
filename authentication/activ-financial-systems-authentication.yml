note: The OnePlatform Web API (One API) is not a REST API and publishes no OpenAPI
  securitySchemes; authentication is credential-based at WebSocket session connect.
  The published ConnectParameters contract (session/connect) takes host, user, and
  password; connect() establishes a session to a OneApi Gateway and rejects with
  StatusCode values such as invalidUser, invalidPassword, accessDenied, and
  notLicensed on failure. Gateway hosts and credentials are provisioned per customer
  by ACTIV/Options Technology - there is no self-serve sign-up, OAuth, or API-key
  scheme documented. Market data access is further entitled per user (permissionId,
  notPermissioned status codes).
summary:
